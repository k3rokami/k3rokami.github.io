<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <title>Kurokami · Projects</title>
  <meta name="description" content="Kurokami — full project list. Web & VR work.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./index.css">
  <script src="./projects-data.js"></script>
</head>

<body>
  <div id="loader" aria-hidden="true">
    <canvas id="loaderPetals"></canvas>
    <div class="loader-inner">
      <div class="mage">
        <img id="mageImg" src="./Background/frieren.png" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
        <svg class="mage-fallback" viewBox="0 0 120 180" width="150" height="225" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M42 46 q-12 -2 -14 24 q-2 34 6 70 q3 14 -2 24" fill="currentColor" fill-opacity=".14"/>
            <path d="M78 46 q12 -2 14 24 q2 34 -6 70 q-3 14 2 24" fill="currentColor" fill-opacity=".14"/>
            <circle cx="60" cy="40" r="17" fill="currentColor" fill-opacity=".10"/>
            <path d="M44 38 q-10 -4 -13 -13"/>
            <path d="M76 38 q10 -4 13 -13"/>
            <path d="M40 60 q20 10 40 0 l10 86 q-30 14 -60 0 z" fill="currentColor" fill-opacity=".12"/>
            <line x1="92" y1="30" x2="100" y2="150"/>
            <circle class="staff-orb" cx="90" cy="26" r="6" fill="currentColor" fill-opacity=".25"/>
          </g>
        </svg>
      </div>
      <div class="loader-name">projects</div>
      <div class="loader-log mono" id="loaderLog"></div>
      <div class="loader-bar"><span id="loaderFill"></span></div>
    </div>
  </div>
  <div id="backdrop"></div>
  <div id="grid-lines"></div>

  <nav>
    <a class="brand" href="./index.html#top"><span class="dot"></span><span class="prompt">~/</span>kurokami</a>
    <div class="nav-links">
      <a href="./index.html#about">about</a>
      <a href="./index.html#stack">stack</a>
      <a href="./index.html#projects">projects</a>
      <a href="./index.html#experience">experience</a>
      <a href="./resume.html">resume</a>
      <a href="./index.html#contact">contact</a>
      <a class="gh" href="https://github.com/k3rokami" target="_blank" rel="noopener">GitHub ↗</a>
    </div>
  </nav>

  <main class="wrap">
    <div class="resume-top" style="margin:40px 0 0">
      <a class="back" href="./index.html">← back to portfolio</a>
    </div>

    <section class="section">
      <div class="section-head"><h2>Projects</h2><span class="line"></span></div>
      <div class="filters reveal" id="filters"></div>
      <div class="proj-page-grid" id="projectGrid"></div>
    </section>
  </main>

  <footer class="foot">built with <span class="heart">❤</span> &amp; vanilla JS · <a href="./index.html" style="color:var(--pink)">~/home</a></footer>

  <script>
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  document.documentElement.setAttribute('data-theme', localStorage.getItem('kk-theme') || 'dark');

  const ghIcon = `<svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>`;

  const grid = document.getElementById('projectGrid');
  const filtersEl = document.getElementById('filters');
  const data = window.PROJECTS_DATA || { projects: [] };
  const list = data.projects;

  function cardHTML(p) {
    const repoLink = p.repo ? `<a href="${p.repo}" target="_blank" rel="noopener" title="Source">${ghIcon}</a>` : '';
    const liveLink = p.live ? `<a href="${p.live}" ${p.live.startsWith('http')?'target="_blank" rel="noopener"':''} title="Live">↗</a>` : '';
    const starHTML = p.stars ? `<span class="meta"><span class="star">★</span>${p.stars}</span>` : '';
    const row = (p.stack||[]).map(s => `<span>${esc(s)}</span>`).join('');
    const img = p.image
      ? `<div class="pimg"><img src="${p.image}" alt="${esc(p.title)}" loading="lazy" onerror="this.closest('.pimg').remove()"></div>`
      : `<div class="pimg pimg-blank"><span>${esc((p.title||'·')[0])}</span></div>`;
    return `${img}
      <div class="langbar"></div>
      <div class="ptop"><span class="folder">▸</span><span class="meta">${starHTML}<span class="ext">${repoLink}${liveLink}</span></span></div>
      <div class="body"><h3>${esc(p.title)}</h3><p>${esc(p.long || p.desc || '')}</p><div class="stack-row">${row}</div></div>`;
  }

  function render(items) {
    grid.innerHTML = '';
    items.forEach((p, i) => {
      const c = document.createElement('article');
      c.className = 'card reveal' + (p.featured ? ' featured' : '');
      c.dataset.lang = p.lang || 'Other';
      c.style.transitionDelay = (i*50) + 'ms';
      c.innerHTML = cardHTML(p);
      const target = p.live || p.repo;
      if (target) {
        c.classList.add('clickable');
        c.addEventListener('click', e => { if (e.target.closest('a')) return; target.startsWith('http') ? open(target,'_blank') : (location.href=target); });
        c.querySelectorAll('.ext a').forEach(a => a.addEventListener('click', e => e.stopPropagation()));
      }
      grid.appendChild(c);
    });
    // reveal
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('show'); io.unobserve(e.target); } }), { threshold: .08 });
    grid.querySelectorAll('.reveal').forEach(el => io.observe(el));
  }

  function buildFilters() {
    const langs = ['All', ...Array.from(new Set(list.map(p => p.lang||'Other')))];
    const counts = {}; list.forEach(p => counts[p.lang||'Other'] = (counts[p.lang||'Other']||0)+1);
    filtersEl.innerHTML = langs.map((l,i) => `<button class="filter${i===0?' active':''}" data-f="${esc(l)}">${esc(l)}<span class="c">${l==='All'?list.length:counts[l]}</span></button>`).join('');
    filtersEl.querySelectorAll('.filter').forEach(b => b.onclick = () => {
      filtersEl.querySelectorAll('.filter').forEach(x => x.classList.remove('active')); b.classList.add('active');
      const f = b.dataset.f;
      grid.querySelectorAll('.card').forEach(c => c.classList.toggle('hide', f !== 'All' && c.dataset.lang !== f));
    });
  }

  render(list);
  buildFilters();

  /* ===== LOADING OVERLAY ===== */
  (function loader(){
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const el = document.getElementById('loader'); if (!el) return;
    const start = Date.now();
    const MIN = reduceMotion ? 0 : 750;
    const logEl = document.getElementById('loaderLog');
    const fill = document.getElementById('loaderFill');
    const lines = [
      `<span class="pk">$</span> ls ~/projects`,
      `  <span class="ok">✓</span> repos indexed`,
      `  <span class="ok">✓</span> ready`
    ];
    if (reduceMotion) { logEl.innerHTML = lines.join('\n'); }
    else { let li=0; (function type(){ if(li>=lines.length) return; logEl.innerHTML = lines.slice(0,li).join('\n') + (li?'\n':'') + lines[li] + '<span class="cur">&nbsp;</span>'; li++; setTimeout(type,220); })(); }
    function setFill(r){ if(fill) fill.style.transform = 'scaleX(' + Math.min(1, Math.max(0, r)) + ')'; }
    const imgs = [...document.images]; const total = Math.max(1, imgs.length); let loaded = 0;
    setFill(0.1);
    imgs.forEach(img => { if(img.complete) { loaded++; setFill(loaded/total); } else { const b=()=>{ loaded++; setFill(loaded/total); }; img.addEventListener('load',b); img.addEventListener('error',b); } });
    if (!reduceMotion) (function petals(){
      const cv=document.getElementById('loaderPetals'); if(!cv) return; const ctx=cv.getContext('2d'); let w,h,parts,raf=0;
      function resize(){ w=cv.width=el.clientWidth; h=cv.height=el.clientHeight; parts=Array.from({length:14},spawn); }
      function spawn(){ return {x:Math.random()*w,y:Math.random()*h,r:2+Math.random()*3,sp:.25+Math.random()*.6,sway:Math.random()*6.28,swaySp:.015+Math.random()*.02,rot:Math.random()*3,rotSp:(Math.random()-.5)*.03,op:.1+Math.random()*.22}; }
      function petal(c,r){ c.beginPath();c.moveTo(0,0);c.bezierCurveTo(r*.5,-r*.5,r,-r*.2,r,r*.4);c.bezierCurveTo(r,r,r*.3,r*1.2,0,r*.9);c.bezierCurveTo(-r*.3,r*1.2,-r,r,-r,r*.4);c.bezierCurveTo(-r,-r*.2,-r*.5,-r*.5,0,0);c.closePath(); }
      function frame(){ ctx.clearRect(0,0,w,h); parts.forEach(p=>{ p.y+=p.sp;p.sway+=p.swaySp;p.x+=Math.sin(p.sway)*.4;p.rot+=p.rotSp; if(p.y>h+14)Object.assign(p,spawn(),{y:-14,x:Math.random()*w}); ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=p.op;ctx.fillStyle='#F48FB1';petal(ctx,p.r);ctx.fill();ctx.restore(); }); raf=requestAnimationFrame(frame); }
      resize(); frame(); el._stopPetals=()=>{ if(raf) cancelAnimationFrame(raf); };
    })();
    function hide(){ const wait=Math.max(0, MIN-(Date.now()-start)); setTimeout(()=>{ setFill(1); el.classList.add('done'); if(el._stopPetals) el._stopPetals(); setTimeout(()=>el.remove(),600); }, wait); }
    if (document.readyState==='complete') hide(); else addEventListener('load', hide);
    setTimeout(hide, 6000);
  })();
  </script>
</body>

</html>
